name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            sanitizers: OFF
            coverage: OFF
          - build_type: Debug
            sanitizers: ON
            coverage: OFF
          - build_type: Debug
            sanitizers: OFF
            coverage: ON

    steps:
      - uses: actions/checkout@v4

      - name: Initialize required common submodule
        run: git submodule update --init --depth 1 stonky-cpp-common

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libboost-dev libspdlog-dev
          python -m pip install "cmake>=4.0,<5"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_DOWNLOADER=OFF
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DENABLE_COVERAGE=${{ matrix.coverage }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  windows-test-only:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize required common submodule
        run: git submodule update --init --depth 1 stonky-cpp-common

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install CMake
        run: python -m pip install "cmake>=4.0,<5"

      - name: Checkout pinned vcpkg registry
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 74e6536215718009aae747d86d84b78376bf9e09
          path: _ci/vcpkg

      - name: Bootstrap vcpkg
        run: .\_ci\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/vcpkg/archives
            _ci/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-74e6536-${{ hashFiles('.github/vcpkg-test/vcpkg.json') }}

      - name: Configure MSVC test build
        run: >-
          cmake -S . -B build-windows
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/_ci/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_MANIFEST_DIR=${{ github.workspace }}/.github/vcpkg-test
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_DOWNLOADER=OFF
          -DBUILD_TESTING=ON

      - name: Build MSVC tests
        run: cmake --build build-windows --config Release --parallel 2

      - name: Test MSVC build
        run: ctest --test-dir build-windows -C Release --output-on-failure

  full-downloader-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize all submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake libtool pkg-config
          python -m pip install "cmake>=4.0,<5" ninja

      - name: Checkout pinned vcpkg registry
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 74e6536215718009aae747d86d84b78376bf9e09
          path: _ci/vcpkg

      - name: Bootstrap vcpkg
        run: ./_ci/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            _ci/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-74e6536-${{ hashFiles('vcpkg.json') }}

      - name: Configure complete downloader
        run: >-
          cmake -S . -B build-full -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/_ci/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DBUILD_DOWNLOADER=ON
          -DBUILD_TESTING=ON
          -DOKX_FETCH_MINIZIP=OFF

      - name: Build complete downloader and connectors
        run: >-
          cmake --build build-full
          --target crypto_data_downloader binance_pagination_test mexc_models_precision_test
          --parallel 2

      - name: Test connector-backed regressions
        run: >-
          ctest --test-dir build-full
          -R "binance_pagination_preserves_progress|mexc_models_preserve_decimal_text"
          --output-on-failure
